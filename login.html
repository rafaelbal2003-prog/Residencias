<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <main class="auth-page d-flex align-items-center min-vh-100">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-xl-5 col-lg-6 col-md-8">
                    <div class="card shadow-lg border-0 overflow-hidden">
                        <div class="card-body p-5">
                            <div class="text-center mb-4">
                                <h1 class="h3 fw-bold mb-1">Plataforma Dual</h1>
                                <p class="text-muted mb-0">Accede con tu correo y contraseña.</p>
                            </div>

                            <form action="#" method="post" autocomplete="off">
                                <div class="mb-3">
                                    <label for="email" class="form-label">Correo electrónico</label>
                                    <input type="email" class="form-control shadow-sm" id="email" name="email" placeholder="nombre@ejemplo.com" required>
                                </div>

                                <div class="mb-3">
                                    <label for="password" class="form-label">Contraseña</label>
                                    <input type="password" class="form-control shadow-sm" id="password" name="password" placeholder="Contraseña" required>
                                </div>


                                <button type="submit" class="btn btn-primary w-100 py-2">Entrar</button>
                            </form>

                            <div class="text-center mt-4">
                                <p class="mb-0">¿No tienes cuenta? <a href="register.html" class="fw-semibold text-decoration-none">Regístrate</a></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
